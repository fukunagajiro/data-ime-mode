<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>data-ime-mode</title>
<style>
  body { font-family: "Meiryo", sans-serif; width: 22rem; margin: 0; padding: 0.9rem;
         font-size: 0.85rem; line-height: 1.6; }
  h1 { font-size: 0.95rem; margin: 0 0 0.6rem; }
  #status { font-weight: bold; }
  .ok { color: #137333; }
  .ng { color: #c5221f; }
  .wait { color: #555; }
  #detail { margin: 0.4rem 0 0; }
  #detail code, dd code { background: #eee; padding: 0.05rem 0.25rem; word-break: break-all; }
  dl { margin: 0.8rem 0 0; font-size: 0.78rem; color: #555; }
  dt { font-weight: bold; margin-top: 0.4rem; }
  dd { margin: 0; }
  button { margin-top: 0.8rem; padding: 0.3rem 0.8rem; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>data-ime-mode</h1>
<p id="status" class="wait">確認中…</p>
<p id="detail"></p>
<button id="recheck">再確認</button>
<dl>
  <dt>ネイティブホスト</dt>
  <dd><code id="hostname"></code></dd>
  <dt>拡張機能 ID</dt>
  <dd><code id="extid"></code></dd>
</dl>
<script src="diagnose.js"></script>
<script src="popup.js"></script>
</body>
</html>
